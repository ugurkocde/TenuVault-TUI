name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Match go.mod: a newer stable Go makes the pinned golangci-lint panic.
          go-version-file: go.mod

      - name: Verify formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          # Pin to a v2 release built with Go >= the go.mod target (1.26.x);
          # otherwise golangci-lint refuses to load the config.
          version: v2.12.2

      - name: Test (race)
        run: go test -race ./...

      - name: Build all targets
        run: |
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build ./... || exit 1
          done

  psmodule:
    # Validates the PowerShell Gallery module (manifest + packaging script) so
    # errors surface on PRs rather than during a tagged release. Uses a dummy
    # binary; the real one is only bundled by the release workflow.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage and validate module
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Content -Path "$env:RUNNER_TEMP/tenuvault.exe" -Value 'dummy'
          ./scripts/build-psmodule.ps1 -Version v0.0.1 -ExePath "$env:RUNNER_TEMP/tenuvault.exe"

      - name: Lint module with PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path ./powershell/TenuVault-TUI -Recurse -Severity Warning
          $results | Format-Table -AutoSize | Out-String | Write-Host
          if ($results) { throw "PSScriptAnalyzer reported $($results.Count) finding(s)." }
